AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple SAM template with a Python Lambda function (ZIP implementation)
Resources:
  MyOneandOnlyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: MyOneandOnlyFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Events:
        Api:
          Type: Api
          Properties:
            Path: /hello
            Method: get
    Metadata:
      SamResourceId: MyOneandOnlyFunction
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello
