# File Location:
# /projects/aws/lambda/zip/template.yaml
#
# Project Structure:
# lambda/zip/
#   ├── src/
#   │   ├── app.py         (Lambda function code)
#   │   └── requirements.txt (Python dependencies)
#   └── template.yaml     (This file - SAM template)
#
# Deployment Steps:
# 1. Install AWS SAM CLI if not installed:
#    brew install aws-sam-cli
#
# 2. Configure AWS credentials:
#    aws configure
#
# 3. Build the application:
#    sam build
#
# 4. Deploy the application:
#    sam deploy --guided
#    - Stack Name: sam-app (or your preferred name)
#    - AWS Region: ap-northeast-1
#    - Confirm changes before deploy: Y
#    - Allow SAM CLI IAM role creation: Y
#    - Disable rollback: N
#    - Save arguments to configuration file: Y
#
# 5. Test the API:
#    curl ${ApiEndpoint}  # The endpoint URL will be shown in the deployment output
#
# To destroy/cleanup:
# 1. Delete the stack using SAM:
#    sam delete
#    - Are you sure you want to delete the stack? Y
#    - Are you sure you want to delete the bucket? Y
#
# 2. Additionally, make sure to delete the CloudFormation stack:
#    aws cloudformation delete-stack --stack-name aws-sam-cli-managed-default
#
# Note: Both steps are necessary for complete cleanup

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Simple SAM template with a Python Lambda function (ZIP implementation)

Resources:
  MyOneandOnlyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.12
      Events:
        Api:
          Type: Api
          Properties:
            Path: /hello
            Method: get

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello"
